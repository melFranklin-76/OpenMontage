name: FISH Daily Digest

on:
  schedule:
    - cron: "0 1 * * *"    # 8:00 PM CT — daily roundup + shorts render
  workflow_dispatch:
  push:
    paths:
      - "creator-studio/studio/fish/**"
      - "tests/creator_studio/fish/**"
      - "creator-studio/out/fish/sample_stories.json"
      - ".github/workflows/fish-daily-digest.yml"
  pull_request:
    paths:
      - "creator-studio/studio/fish/**"
      - "tests/creator_studio/fish/**"
      - "creator-studio/out/fish/sample_stories.json"
      - ".github/workflows/fish-daily-digest.yml"

permissions:
  contents: write

jobs:
  fish-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: creator-studio

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest jsonschema pyyaml feedparser

      - name: Run FISH tests
        run: |
          python -m pytest tests/creator_studio/fish -q

      - name: Generate sample FISH digest
        run: |
          python -m studio.fish.daily_digest \
            --input creator-studio/out/fish/sample_stories.json \
            --output creator-studio/out/fish/daily_story_candidates.example.json

      - name: Show generated digest
        run: |
          cat creator-studio/out/fish/daily_story_candidates.example.json

  fish-live-digest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: creator-studio
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      # Must live on the job (not the step): step-level env is invisible to that
      # step's `if:`, so the publish step was skipping every night even when the
      # secret was set. Same pattern as fish-shorts-stagger.yml.
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      # Long roundup privacy. unlisted = real upload with a shareable URL, not
      # buried as a private draft. Flip to "public" when you're ready for
      # search/browse growth and YPP watch-time on the flagship show.
      YOUTUBE_LONG_PRIVACY: unlisted
      # How many vertical Shorts to cut per night. Deliberately small:
      # YouTube's inauthentic-content policy treats high-volume,
      # template-identical uploads as mass production, and that judgement is
      # applied to the channel as a whole rather than per video. The long
      # roundup still covers ten stories — it is one considered piece, not
      # ten near-identical ones, and it is the asset that accrues watch time.
      SHORTS_COUNT: "3"

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps (ffmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install feedparser jsonschema pyyaml pillow edge-tts yt-dlp \
            google-auth google-auth-oauthlib google-api-python-client

      - name: Install Remotion composer (word-highlight captions for Shorts)
        run: npm ci --prefix remotion-composer

      # Creator-watch remembers which episode it already mined so Funky Dineva
      # (and peers that don't post nightly) keep contributing between uploads.
      # Without this cache every Actions run starts cold and re-fetches captions.
      - name: Restore creator-watch state
        uses: actions/cache@v4
        with:
          path: creator-studio/out/fish/creator_watch_state.json
          key: fish-creator-watch-state-${{ github.run_id }}
          restore-keys: |
            fish-creator-watch-state-

      - name: Run live daily digest
        run: |
          python -m studio.fish.daily_digest \
            --live \
            --social \
            --creator-watch \
            --creator-watch-state creator-studio/out/fish/creator_watch_state.json \
            --output fish-digest-$(date -u +%Y-%m-%d).json

      - name: Show today's top stories
        run: |
          python -c "
          import json, sys
          data = json.load(open(sys.argv[1]))
          print(f'Date: {data[\"date\"]}')
          print(f'Total candidates: {len(data[\"items\"])}')
          print()
          for i, item in enumerate(data['items'][:10], 1):
              print(f'{i}. [{item[\"matched_lane\"]}] {item[\"title\"]}')
              print(f'   Score: {item[\"relevance_score\"]:.2f} | {item[\"source\"]}')
              print(f'   {item[\"url\"]}')
              print()
          " fish-digest-*.json

      - name: Generate reel scripts for the top stories
        run: |
          DIGEST=$(ls fish-digest-*.json | head -1)
          for RANK in $(seq 1 "$SHORTS_COUNT"); do
            python -m studio.fish.research_handoff \
              --digest "$DIGEST" --rank "$RANK" \
              --output "fish-handoff-rank${RANK}.json" 2>/dev/null || continue
            python -m studio.fish.reel_script \
              --handoff "fish-handoff-rank${RANK}.json" \
              --output "fish-script-rank${RANK}.json" 2>/dev/null || true
          done
          echo "Generated scripts:"
          ls -la fish-script-rank*.json 2>/dev/null || echo "No scripts generated"

      - name: Build long-form roundup script
        run: |
          DIGEST=$(ls fish-digest-*.json | head -1)
          python -m studio.fish.long_roundup_script \
            --digest "$DIGEST" \
            --count 10 \
            --output fish-roundup-script.json

      - name: Show generated scripts
        run: |
          for f in fish-script-rank*.json; do
            [ -f "$f" ] || continue
            python -c "
          import json, sys
          s = json.load(open(sys.argv[1]))
          print(f'Rank {sys.argv[1]}: [{s[\"lane\"]}] {s[\"topic\"]}')
          total = sum(sec[\"duration_seconds\"] for sec in s[\"sections\"])
          print(f'  {total}s, {len(s[\"sections\"])} sections')
          print()
          " "$f"
          done

      - name: Render short reels to MP4 (one per story)
        run: |
          set -euo pipefail
          FAILED=0
          for RANK in $(seq 1 "$SHORTS_COUNT"); do
            SCRIPT="fish-script-rank${RANK}.json"
            [ -f "$SCRIPT" ] || continue
            echo "::group::Render rank ${RANK}"
            if ! python -m studio.fish.reel_render \
              --script "$SCRIPT" \
              --output "fish-reel-rank${RANK}.mp4"; then
              echo "::error::reel_render failed for rank ${RANK}"
              FAILED=$((FAILED + 1))
            fi
            echo "::endgroup::"
          done
          echo "Rendered reels:"
          ls -la fish-reel-rank*.mp4 2>/dev/null || echo "No reels rendered"
          # Fail the job if every rank we attempted failed; a single bad
          # story shouldn't tank the run, but a total failure should.
          if [ ! -f fish-reel-rank1.mp4 ] && [ ! -f fish-reel-rank2.mp4 ] && [ ! -f fish-reel-rank3.mp4 ]; then
            echo "::error::No reels were rendered — failing job for visibility"
            exit 1
          fi

      - name: Create public release assets for top 3 reels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="fish-daily-$(TZ=America/Chicago date +%Y-%m-%d)"
          ASSETS=()
          for RANK in 1 2 3; do
            FILE="fish-reel-rank${RANK}.mp4"
            if [ -f "$FILE" ]; then
              ASSETS+=("$FILE")
            fi
          done
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "No top-3 reels rendered; skipping release asset upload."
            exit 0
          fi
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "Public FISH top-3 reel assets for Instagram publishing." \
            --prerelease \
            "${ASSETS[@]}"

      - name: Render long-form roundup to MP4
        run: |
          python -m studio.fish.long_roundup_render \
            --script fish-roundup-script.json \
            --output fish-roundup.mp4
          ls -la fish-roundup.mp4

      - name: Publish long-form roundup to YouTube
        if: env.YOUTUBE_TOKEN_JSON != ''
        run: |
          set -euo pipefail
          if [ ! -f fish-roundup-script.json ] || [ ! -f fish-roundup.mp4 ]; then
            echo "::error::Roundup script or video missing — cannot publish"
            exit 1
          fi
          # Failures used to be swallowed with `|| true`, so a dead token or
          # API rejection looked like a successful night. Surface them.
          python -m studio.fish.youtube_publisher \
            --script fish-roundup-script.json \
            --video fish-roundup.mp4 \
            --media-manifest fish-roundup.media.json \
            --format long \
            --privacy "${YOUTUBE_LONG_PRIVACY}" \
            --output fish-youtube-roundup.json
          echo "Uploaded long roundup:"
          cat fish-youtube-roundup.json

      - name: Warn when YouTube token is missing
        if: env.YOUTUBE_TOKEN_JSON == ''
        run: |
          echo "::warning::YOUTUBE_TOKEN_JSON secret is empty — long roundup was rendered but not uploaded"

      - name: Upload digest, scripts, and reels
        uses: actions/upload-artifact@v4
        with:
          name: fish-daily-${{ github.run_id }}
          path: |
            fish-digest-*.json
            fish-script-rank*.json
            fish-reel-rank*.mp4
            fish-reel-rank*.media.json
            fish-roundup-script.json
            fish-roundup.mp4
            fish-roundup.media.json
            fish-youtube-*.json
          retention-days: 30
